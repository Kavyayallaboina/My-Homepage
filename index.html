<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Homepage</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        font-family: "Poppins", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        color: black;
        position: relative;
        overflow: hidden;
    }

    /* Background */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        filter: brightness(1.2) saturate(1.4);
        z-index: -1;
        transition: background-image 1s ease-in-out;
    }

    body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            rgba(255,200,150,0.3),
            rgba(150,200,255,0.3)
        );
        z-index: -1;
    }

    /* ✨ Wishes Font */
    #wish {
        margin-top: 70px;
        font-family: "Playfair Display", serif;
        font-size: 48px;
        font-weight: 700;
        text-shadow: 2px 2px 10px white;
        letter-spacing: 1px;
    }

    /* 💬 Quotes Font */
    #quote {
        margin-top: 15px;
        font-family: "Poppins", sans-serif;
        font-size: 22px;
        max-width: 80%;
        text-align: center;
        font-weight: 500;
        transition: opacity 0.5s ease;
        text-shadow: 1px 1px 5px white;
    }

    .search-container {
        margin-top: 60px;
        width: 60%;
        max-width: 550px;
        display: flex;
    }

    .search-box {
        flex: 1;
        padding: 15px 20px;
        border: none;
        border-radius: 30px 0 0 30px;
        outline: none;
        font-size: 18px;
    }

    .search-btn {
        background: white;
        border: none;
        padding: 15px 25px;
        border-radius: 0 30px 30px 0;
        font-size: 18px;
        cursor: pointer;
    }
</style>
</head>

<body>

<div id="wish"></div>
<div id="quote"></div>

<form class="search-container" action="https://www.google.com/search">
    <input type="text" name="q" class="search-box" placeholder="Search Google...">
    <button type="submit" class="search-btn">Go</button>
</form>

<script>
    const hour = new Date().getHours();
    let greeting = "";

    if(hour < 12) greeting = "Good Morning, Kavya!";
    else if(hour < 17) greeting = "Good Afternoon, Kavya!";
    else greeting = "Good Evening, Kavya!";

    document.getElementById("wish").innerText = greeting;

    const images = [
    "https://i.ibb.co/35VkhRvh/flower.jpg",
    "https://i.ibb.co/qFsrkg19/flowers.jpg",
    "https://i.ibb.co/XvSvJX3/imgage.jpg",
    "https://i.ibb.co/CpqkVr9P/lotus.jpg",
    "https://i.ibb.co/0pzCzbcY/sun.jpg",
    "https://i.ibb.co/d0B4Qjp0/image.jpg",   // New
    "https://i.ibb.co/qL0jZJm0/img.jpg"      // New
];
    
    function changeBackground() {
        const randomIndex = Math.floor(Math.random() * images.length);
        document.body.style.backgroundImage = `url(${images[randomIndex]})`;
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center";
    }

    changeBackground();
    setInterval(changeBackground, 600000);

    const quotes = [
        "Start your day with confidence.",
        "Push a little more, Kavya!",
        "Consistency beats motivation.",
        "You are growing every single day.",
        "Discipline creates freedom.",
        "Rest now, conquer tomorrow."
    ];

    const quoteElement = document.getElementById("quote");

    function changeQuote() {
        const randomIndex = Math.floor(Math.random() * quotes.length);
        quoteElement.style.opacity = 0;
        setTimeout(() => {
            quoteElement.innerText = quotes[randomIndex];
            quoteElement.style.opacity = 1;
        }, 300);
    }

    changeQuote();
    setInterval(changeQuote, 200000);
</script>

</body>
</html>
