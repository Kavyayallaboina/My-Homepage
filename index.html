<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Homepage</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #f5f5f5;
        font-family: "Poppins", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        color: black;
    }

    .top-image {
        margin-top: 30px;
        width: 250px;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    #wish {
        margin-top: 30px;
        font-size: 45px;
        font-weight: 700;
        text-shadow: 1px 1px 3px white;
    }

    #quote {
        margin-top: 15px;
        font-size: 22px;
        max-width: 80%;
        text-align: center;
        font-weight: 500;
        transition: opacity 0.5s ease;
    }

    .search-container {
        margin-top: 60px;
        width: 60%;
        max-width: 550px;
        display: flex;
    }

    .search-box {
        flex: 1;
        padding: 15px 20px;
        border: none;
        border-radius: 30px 0 0 30px;
        outline: none;
        font-size: 18px;
    }

    .search-btn {
        background: white;
        border: none;
        padding: 15px 25px;
        border-radius: 0 30px 30px 0;
        font-size: 18px;
        cursor: pointer;
    }
</style>
</head>

<body>

<img src="https://i.ibb.co/7tdsN8ZP/Monk-WO.jpg" class="top-image" alt="Monk-WO">

<div id="wish"></div>

<div id="quote"></div>

<form class="search-container" action="https://www.google.com/search">
    <input type="text" name="q" class="search-box" placeholder="Search Google...">
    <button type="submit" class="search-btn">Go</button>
</form>

<script>
    const hour = new Date().getHours();
    let greeting = "";

    if(hour < 12) greeting = "Good Morning, Kavya!";
    else if(hour < 17) greeting = "Good Afternoon, Kavya!";
    else greeting = "Good Evening, Kavya!";

    document.getElementById("wish").innerText = greeting;

    // Quotes based on time
    const morningQuotes = [
        "Start your day with confidence.",
        "New day, new opportunities.",
        "Small progress is still progress.",
        "Discipline creates freedom."
    ];

    const afternoonQuotes = [
        "Stay focused, you're doing great.",
        "Push a little more, Kavya!",
        "Consistency beats motivation.",
        "Your effort today builds tomorrow."
    ];

    const eveningQuotes = [
        "Reflect. Reset. Rise again.",
        "You did your best today.",
        "Rest now, conquer tomorrow.",
        "Growth happens daily."
    ];

    let selectedQuotes;

    if(hour < 12) selectedQuotes = morningQuotes;
    else if(hour < 17) selectedQuotes = afternoonQuotes;
    else selectedQuotes = eveningQuotes;

    const quoteElement = document.getElementById("quote");

    function changeQuote() {
        const randomIndex = Math.floor(Math.random() * selectedQuotes.length);
        quoteElement.style.opacity = 0;
        setTimeout(() => {
            quoteElement.innerText = selectedQuotes[randomIndex];
            quoteElement.style.opacity = 1;
        }, 300);
    }

    changeQuote(); // initial quote

    // Change every 10 minutes (600000 ms)
    setInterval(changeQuote, 600000);
</script>

</body>
</html>
